<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login · Godwin Empire</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><div class="container">Premium learning • coding • business • market education · Nigeria</div></div><header class="nav"><div class="container navin"><button class="menu" type="button" aria-label="Open navigation menu" aria-expanded="false">☰ Menu</button><a class="brand" href="index.html"><img src="logo.png" alt="Godwin Empire logo"><span>GODWIN <b>EMPIRE</b></span></a><nav class="links"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="signals.html">Signals</a><a href="books.html">Books</a><a href="exams.html">Exams</a><a href="student.html">Student Portal</a><a href="teacher-login.html">Teacher Portal</a><a href="contact.html">Contact</a><a class="btn small" href="admin-login.html">Admin</a></nav></div></header><section class="page-hero"><div class="container"><div class="eyebrow">Teacher portal</div><h1>Teacher Login</h1><p class="muted">Restricted access for Godwin Empire instructors.</p></div></section><section class="section"><div class="container" style="max-width:520px"><div class="panel"><form id="teacherLoginForm" class="form" autocomplete="off"><div class="form-group"><label>Email</label><input id="teacherEmail" name="instructor-login-email" type="email" autocomplete="off" autocapitalize="none" required></div><div class="form-group"><label>Password</label><input id="teacherPassword" name="instructor-access-code" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required></div><button class="btn" type="submit">Log in</button><div id="teacherLoginMsg" class="notice" style="display:none;margin-top:15px"></div></form></div></div></section><script src="data.js"></script><script src="app.js"></script><script>document.getElementById('teacherLoginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('teacherLoginMsg');try{const r=await fetch('/api/teacher/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:teacherEmail.value,password:teacherPassword.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href='teacher.html';}catch(err){msg.style.display='block';msg.className='notice danger';msg.textContent=err.message;}}</script></body></html>
